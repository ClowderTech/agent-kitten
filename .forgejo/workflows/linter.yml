name: Lint

on:
    push:
        branches:
            - "master"
        tags:
            - "v*.*.*"
    pull_request:
        types: [opened, synchronize, reopened]

jobs:
    lint:
        name: Lint
        runs-on: docker

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: latest

            - name: Install Dependencies
              run: npm install --include=dev

            - name: Lint
              run: npm run lint

            - name: Test
              run: npm run test
