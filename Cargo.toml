[package]
name = "agent-kitten"
version = "3.5.15"
edition = "2024"

[dependencies]
serenity = { version = "0.12.5", features = [
  "builder",
  "cache",
  "collector",
  "client",
  "framework",
  "gateway",
  "http",
  "model",
  "utils",
  "voice",
  "simd_json",
  "temp_cache",
  "chrono",
  "interactions_endpoint",
  "native_tls_backend",
  "default_native_tls",
], default-features = false }
poise = { version = "0.6.2", features = [
  "cache",
  "chrono",
  "handle_panics",
], default-features = false }
tokio = { version = "1.53.1", features = [
  "rt-multi-thread",
  "macros",
  "signal",
  "time",
  "sync",
  "process",
  "fs",
  "net",
] }
tokio-tungstenite = { version = "0.30.0", features = [
  "native-tls",
  "tokio-native-tls",
] }
native-tls = { version = "0.2.18" }
simd-json = { version = "0.18.1" }
songbird = { version = "0.6.0", features = [
  "gateway",
  "serenity",
  "native",
  "builtin-queue",
], default-features = false }
symphonia = { version = "0.6.1", features = ["opt-simd"] }
lavalink-rs = { version = "0.15.0", features = [
  "songbird",
  "serenity",
  "macros",
  "tungstenite-native-tls",
], default-features = false }
sysinfo = { version = "0.39.6" }
chrono = { version = "0.4.45" }
mongodb = { version = "3.8.1" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151" }
serde_with = { version = "3.22.0" }
futures = { version = "0.3.34" }
async-openai = { version = "0.41.3", features = [
  "native-tls",
  "webhook",
  "responses",
  "audio",
  "video",
  "image",
  "embedding",
  "model",
  "chatkit",
  "container",
  "chat-completion",
  "completions",
], default-features = false }
once_cell = { version = "1.21.4" }
rand = { version = "0.10.2" }
bson = { version = "3.1.0", features = [
  "serde",
  "serde_json-1",
  "compat-3-0-0",
  "serde_with-3",
] }
reqwest = { version = "0.13.4", features = ["native-tls", "json"] }
urlencoding = { version = "2.1.3" }
base64 = { version = "0.23.1" }
bytes = { version = "1.12.1" }
human_bytes = { version = "0.4.3" }
html-to-markdown-rs = { version = "3.11.4" }

[build-dependencies]
barexp = { version = "1.1.1" }
