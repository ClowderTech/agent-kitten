[package]
name = "agent-kitten-rust"
version = "3.0.2"
edition = "2024"

[dependencies]
serenity = { version = "0.12.5", features = [
  "builder",
  "cache",
  "collector",
  "client",
  "framework",
  "gateway",
  "http",
  "model",
  "utils",
  "voice",
  "simd_json",
  "temp_cache",
  "chrono",
  "interactions_endpoint",
  "native_tls_backend",
  "default_native_tls",
], default-features = false }
poise = { version = "0.6.1", features = [
  "cache",
  "chrono",
  "handle_panics",
], default-features = false }
tokio = { version = "1.48.0", features = [
  "rt-multi-thread",
  "macros",
  "signal",
  "time",
  "sync",
  "process",
  "fs",
] }
songbird = { version = "0.5.0", features = [
  "gateway",
  "serenity",
  "native",
  "builtin-queue",
], default-features = false }
symphonia = { version = "0.5.5", features = ["aac", "mp3", "isomp4", "alac"] }
lavalink-rs = { version = "0.14.3", features = [
  "songbird",
  "serenity",
  "macros",
  "tungstenite-native-tls",
], default-features = false }
sysinfo = { version = "0.37.2" }
chrono = { version = "0.4.42" }
mongodb = { version = "3.4.1" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145" }
serde_with = { version = "3.16.1" }
futures = { version = "0.3.31" }
async-openai = { version = "0.32.2", features = [
  "native-tls",
  "webhook",
  "responses",
  "audio",
  "video",
  "image",
  "embedding",
  "model",
  "chatkit",
  "container",
  "chat-completion",
  "completions",
], default-features = false }
once_cell = "1.21.3"
rand = "0.9.2"
bson = { version = "3.1.0", features = [
  "serde",
  "serde_json-1",
  "compat-3-0-0",
  "serde_with-3",
] }
tokio-tungstenite = { version = "0.28.0", features = [
  "native-tls",
  "tokio-native-tls",
] }

[patch.crates-io]
# poise = { git = "https://github.com/serenity-rs/poise", branch = "serenity-next" }
# serenity = { git = "https://github.com/serenity-rs/serenity", rev = "5ffc96697025b4363995a158eb9f74e68024045c" }
# songbird = { git = "https://github.com/serenity-rs/songbird", branch = "next" }

[build-dependencies]
barexp = { version = "1.1.1" }
